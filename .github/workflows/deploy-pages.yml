name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent overlapping deploys on fast pushes
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write  # required to push to gh-pages with GITHUB_TOKEN

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          CI: true
        run: |
          # Base path for GitHub Pages: ekrembal.github.io/bitcoin-history
          # Also works at ekrembal.com/bitcoin-history with custom domain
          BASE_PATH=/bitcoin-history/ pnpm run build
          # Make client-side routing work on refreshes (if you add React Router later)
          cp dist/index.html dist/404.html || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
